<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Practice Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background-color: #007aff;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background-color: #007aff;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot {
            align-self: flex-start;
            background-color: #e9e9eb;
            color: black;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e5e5ea;
            background-color: #fff;
        }
        input {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 10px 16px;
            outline: none;
            font-size: 0.95rem;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #b0c4de;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">English Practice Assistant</div>
    <div class="messages" id="messages">
        <div class="message bot">Hello! I'm your English practice assistant. What would you like to chat about today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your English message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const messageText = input.value.trim();

        if (!messageText) return;

        appendMessage(messageText, 'user');
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        try {
            const res = await fetch('https://english-ai-bot-kubm.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText })
            });

            const data = await res.json();

            if (data.reply) {
                appendMessage(data.reply, 'bot');
            } else {
                appendMessage('Error: ' + (data.error || 'No response from server'), 'bot');
            }
        } catch (err) {
            appendMessage('Failed to connect to server. Please try again.', 'bot');
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function appendMessage(text, sender) {
        const messagesDiv = document.getElementById('messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
